'Das Kalender-Abonnement wird hiermit beendet. Du kannst jederzeit einen neuen Link erzeugen. Dieser wird sich von diesem jedoch unterscheiden.': 'This calendar subscription will now be cancelled. You can create a new link at any time; it will be different from this one.'
'Mit einem Webcal-Kalender kannst Du Deine Spieltermine in Deinem Kalender-Programm (z.B. auf dem Handy oder in Google Kalender) abonnieren. Die Termine werden dann automatisch aktualisiert, wenn es Änderungen gibt. Bitte beachte, dass der Link öffentlich ist und nicht weitergegeben werden sollte.': 'A Webcal calendar lets you subscribe to your play dates in a calendar app (for example, on your phone or in Google Calendar). Dates are updated automatically when changes are made. Please note that the link is public and should not be shared.'
'Kalender auf Android mit Google abonnieren': 'Subscribe on Android with Google Calendar'
'Kalender-App öffnen: Öffne die Google Kalender-App auf deinem Android-Gerät.': 'Open the calendar app: Open Google Calendar on your Android device.'
'Menü öffnen - Tippe oben links auf das Drei-Linien-Menü (☰).': 'Open the menu - Tap the three-line menu (☰) in the upper-left corner.'
'„Abonnements“ auswählen Scrolle nach unten und tippe auf „Abonnements“.': 'Select “Subscriptions” - Scroll down and tap “Subscriptions”.'
'Webcal-Link einfügen Tippe auf „Hinzufügen“ und dann auf „Aus URL“. Füge den Webcal-Link ein und bestätige mit „Abonnieren“.': 'Add the Webcal link - Tap “Add”, then “From URL”. Paste the Webcal link and confirm with “Subscribe”.'
'Kalender auf Android mit der App ICSx⁵ abonnieren': 'Subscribe on Android with the ICSx⁵ app'
'App installieren - Installiere die App „ICSx⁵“, am besten aus dem F-Droid Store, dort ist sie kostenlos und werbefrei.': 'Install the app - Install “ICSx⁵”, preferably from the F-Droid Store, where it is free and ad-free.'
'Kalender hinzufügen - Öffne die App und tippe auf das „+“-Symbol (unten rechts) und wähle „Neues Kalender-Abonnement“.': 'Add a calendar - Open the app, tap the “+” icon in the lower-right corner, and select “New calendar subscription”.'
'Webcal-Link einfügen - Gib den Webcal-Link ein und bestätige mit „Weiter“.': 'Add the Webcal link - Enter the Webcal link and confirm with “Next”.'
'Einstellungen prüfen - Wähle einen Namen für den Kalender, die Farbe und wie oft er aktualisiert werden soll. Tippe dann auf „Speichern“.': 'Check the settings - Choose a name and color for the calendar and how often it should update. Then tap “Save”.'
'Hinweis:': 'Note:'
'Die App fragt dich beim ersten Start nach Berechtigungen für den Kalender – diese musst du erlauben, damit alles funktioniert.': 'The first time you start the app, it will ask for calendar permissions. You must grant them for everything to work.'
'Kalender auf iOS abonnieren': 'Subscribe on iOS'
'Kalender-App öffnen: Öffne die „Einstellungen“-App auf deinem iOS-Gerät und scrolle nach unten zu „Kalender“.': 'Open the calendar settings: Open the Settings app on your iOS device and scroll down to “Calendar”.'
'„Accounts“ auswählen - Tippe auf „Accounts“ und dann auf „Account hinzufügen“.': 'Select “Accounts” - Tap “Accounts”, then “Add Account”.'
'„Andere“ auswählen - Wähle „Andere“ und dann „Kalenderabo hinzufügen“.': 'Select “Other” - Choose “Other”, then “Add Subscribed Calendar”.'
'Webcal-Link einfügen - Gib den Webcal-Link ein und tippe auf „Abonnieren“.': 'Add the Webcal link - Enter the Webcal link and tap “Subscribe”.'
'Einstellungen prüfen - Überprüfe die Einstellungen für den Kalender (z.B. Name, Farbe) und tippe auf „Speichern“.': 'Check the settings - Review the calendar settings (such as name and color), then tap “Save”.'
'Falls du den Link nicht direkt einfügen kannst, versuche ihn zuerst im Safari-Browser zu öffnen – iOS erkennt dann oft automatisch, dass es sich um einen Kalender handelt.': 'If you cannot paste the link directly, try opening it in Safari first. iOS will often recognize it as a calendar automatically.'
'Hier kannst Du Dir Webcal-Kalender-Links erstellen, um sie in einer Kalender-App, z.B. auf dem Handy zu abonnieren.': 'Create Webcal calendar links here to subscribe to your dates in a calendar app, for example on your phone.'
'Achtung: Der Link ist öffentlich. Bitte nicht weitergeben!': 'Warning: The link is public. Please do not share it!'
'Hier kannst Du Dir Deine Spieltermine als Ical Kalender(*.ics) herunterladen, um sie in eine Kalender-App z.B. auf dem Handy zu importieren.': 'Download your play dates as an iCalendar file (*.ics) here to import them into a calendar app, for example on your phone.'
