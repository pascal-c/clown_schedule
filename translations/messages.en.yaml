'Datenschutzerklärung': 'Privacy policy'
'Wir nehmen den Schutz Ihrer personenbezogenen Daten sehr ernst. Unglaublich ernst. Wir schützen Ihre Daten in ungeahnter Weise!': 'We take the protection of your personal data very seriously. Incredibly seriously. We protect your data in ways you would never expect!'
'Wir nehmen Datenschutz so ernst, dass wir derzeit diskutieren, ob wir nicht all unsere Dienste einstellen sollten, um Ihre Daten': 'We take data protection so seriously that we are currently discussing whether to discontinue all our services in order to protect your data'
'Spaß beiseite: Wir nehmen den Schutz Ihrer personenbezogenen Daten wirklich ernst. Wir geben Ihre Daten auch an niemanden weiter. Auf gar keinen Fall. Niemals.': 'Joking aside: We really do take the protection of your personal data seriously. We do not share your data with anyone. Absolutely not. Never.'
'Außer vielleicht in ganz besonderen Ausnahmesituationen, wie vielleicht, wenn Sie unsere Webseite betreten. Dann geben wir Ihre Daten an Google weiter. Und an Facebook. Und Twitter. Ach ja, und an Instagram, LinkedIn, Pinterest, TikTok, Snapchat, Meta, Alphabet Inc, sowie an: X, Microsoft, Amazon, Apple, IBM, Oracle, SAP, Salesforce, Adobe, Dropbox, Box, Slack, Zoom, Cisco, Huawei, Alibaba und Tencent. Selbstverständlich senden wir Ihre Daten auch an den BND und die NASA. Das geht ja gar nicht anders.': 'Except perhaps in very special exceptional situations, such as when you visit our website. Then we share your data with Google. And Facebook. And Twitter. Oh, and Instagram, LinkedIn, Pinterest, TikTok, Snapchat, Meta, Alphabet Inc, as well as X, Microsoft, Amazon, Apple, IBM, Oracle, SAP, Salesforce, Adobe, Dropbox, Box, Slack, Zoom, Cisco, Huawei, Alibaba, and Tencent. Naturally, we also send your data to the German Federal Intelligence Service and NASA. There is no other way.'
'Das war natürlich nur ein Scherz. Wir geben Ihre Daten nicht an Dritte weiter.': 'That was, of course, a joke. We do not share your data with third parties.'
'Personenbezogene Daten (nachfolgend zumeist nur „Daten“ genannt) werden von uns nur im Rahmen der Erforderlichkeit sowie zum Zwecke der Bereitstellung eines funktionsfähigen und nutzerfreundlichen Internetauftritts, inklusive seiner Inhalte und der dort angebotenen Leistungen, verarbeitet.': 'We process personal data (hereinafter generally referred to simply as “data”) only to the extent necessary to provide a functional, user-friendly website, including its content and the services offered there.'
'Gemäß Art. 4 Ziffer 1. der Verordnung (EU) 2016/679, also der Datenschutz-Grundverordnung (nachfolgend nur „DSGVO“ genannt), gilt als „Verarbeitung“ jeder mit oder ohne Hilfe automatisierter Verfahren ausgeführter Vorgang oder jede solche Vorgangsreihe im Zusammenhang mit personenbezogenen Daten, wie das Erheben, das Erfassen, die Organisation, das Ordnen, die Speicherung, die Anpassung oder Veränderung, das Auslesen, das Abfragen, die Verwendung, die Offenlegung durch Übermittlung, Verbreitung oder eine andere Form der Bereitstellung, den Abgleich oder die Verknüpfung, die Einschränkung, das Löschen oder die Vernichtung.': 'Under Article 4(1) of Regulation (EU) 2016/679, the General Data Protection Regulation (hereinafter “GDPR”), “processing” means any operation or set of operations performed on personal data, whether or not by automated means, such as collection, recording, organization, structuring, storage, adaptation or alteration, retrieval, consultation, use, disclosure by transmission, dissemination or otherwise making available, alignment or combination, restriction, erasure or destruction.'
'Mit der nachfolgenden Datenschutzerklärung informieren wir Sie insbesondere über Art, Umfang, Zweck, Dauer und Rechtsgrundlage der Verarbeitung personenbezogener Daten, soweit wir entweder allein oder gemeinsam mit anderen über die Zwecke und Mittel der Verarbeitung entscheiden. Zudem informieren wir Sie nachfolgend über die von uns zu Optimierungszwecken sowie zur Steigerung der Nutzungsqualität eingesetzten Fremdkomponenten, soweit hierdurch Dritte Daten in wiederum eigener Verantwortung verarbeiten.': 'This privacy policy explains in particular the nature, scope, purpose, duration, and legal basis for processing personal data where we determine the purposes and means of processing, alone or jointly with others. It also describes third-party components we use to optimize the site and improve the user experience, where third parties process data under their own responsibility.'
'Unsere Datenschutzerklärung ist wie folgt gegliedert:': 'This privacy policy is organized as follows:'
'I. Informationen über uns als Verantwortliche': 'I. Information about us as the controller'
'II. Rechte der Nutzer und Betroffenen': 'II. Rights of users and data subjects'
'III. Informationen zur Datenverarbeitung': 'III. Information about data processing'
'Verantwortlicher Anbieter dieses Internetauftritts im datenschutzrechtlichen Sinne ist:': 'The controller of this website, for data protection purposes, is:'
'Mit Blick auf die nachfolgend noch näher beschriebene Datenverarbeitung haben die Nutzer und Betroffenen das Recht': 'With regard to the data processing described in more detail below, users and data subjects have the right to:'
'auf Bestätigung, ob sie betreffende Daten verarbeitet werden, auf Auskunft über die verarbeiteten Daten, auf weitere Informationen über die Datenverarbeitung sowie auf Kopien der Daten (vgl. auch Art. 15 DSGVO)': 'obtain confirmation as to whether their data is being processed, access to the processed data, further information about the processing, and copies of the data (see also Article 15 GDPR)'
'auf Berichtigung oder Vervollständigung unrichtiger bzw. unvollständiger Daten (vgl. auch Art. 16 DSGVO)': 'have inaccurate or incomplete data corrected or completed (see also Article 16 GDPR)'
'auf unverzügliche Löschung der sie betreffenden Daten (vgl. auch Art. 17 DSGVO), oder, alternativ, soweit eine weitere Verarbeitung gemäß Art. 17 Abs. 3 DSGVO erforderlich ist, auf Einschränkung der Verarbeitung nach Maßgabe von Art. 18 DSGVO': 'have their data erased without undue delay (see also Article 17 GDPR), or, alternatively, have processing restricted under Article 18 GDPR where further processing is required under Article 17(3) GDPR'
'auf Erhalt der sie betreffenden und von ihnen bereitgestellten Daten und auf Übermittlung dieser Daten an andere Anbieter/Verantwortliche (vgl. auch Art. 20 DSGVO)': 'receive the data concerning them that they have provided and have it transferred to other providers/controllers (see also Article 20 GDPR)'
'auf Beschwerde gegenüber der Aufsichtsbehörde, sofern sie der Ansicht sind, dass die sie betreffenden Daten durch den Anbieter unter Verstoß gegen datenschutzrechtliche Bestimmungen verarbeitet werden (vgl. auch Art. 77 DSGVO).': 'lodge a complaint with the supervisory authority if they believe that the provider is processing their data in violation of data protection law (see also Article 77 GDPR).'
'Darüber hinaus ist der Anbieter dazu verpflichtet, alle Empfänger, denen gegenüber Daten durch den Anbieter offengelegt worden sind, über jedwede Berichtigung oder Löschung von Daten oder die Einschränkung der Verarbeitung, die aufgrund der Artikel 16, 17 Abs. 1, Art. 18 DSGVO erfolgt, zu unterrichten. Diese Verpflichtung besteht jedoch nicht, soweit diese Mitteilung unmöglich oder mit einem unverhältnismäßigen Aufwand verbunden ist. Unbeschadet dessen hat der Nutzer ein Recht auf Auskunft über diese Empfänger.': 'In addition, the provider must notify all recipients to whom data has been disclosed of any correction or erasure of data, or restriction of processing under Articles 16, 17(1), and 18 GDPR. This obligation does not apply where notification is impossible or would involve disproportionate effort. The user nevertheless has the right to be informed about these recipients.'
'Ebenfalls haben die Nutzer und Betroffenen nach Art. 21 DSGVO das Recht auf Widerspruch gegen die künftige Verarbeitung der sie betreffenden Daten, sofern die Daten durch den Anbieter nach Maßgabe von Art. 6 Abs. 1 lit. f) DSGVO verarbeitet werden. Insbesondere ist ein Widerspruch gegen die Datenverarbeitung zum Zwecke der Direktwerbung statthaft.': 'Under Article 21 GDPR, users and data subjects also have the right to object to future processing of their data where the provider processes it under Article 6(1)(f) GDPR. In particular, they may object to processing for direct marketing purposes.'
'Ihre bei Nutzung unseres Internetauftritts verarbeiteten Daten werden gelöscht oder gesperrt, sobald der Zweck der Speicherung entfällt, der Löschung der Daten keine gesetzlichen Aufbewahrungspflichten entgegenstehen und nachfolgend keine anderslautenden Angaben zu einzelnen Verarbeitungsverfahren gemacht werden.': 'Data processed when you use this website will be erased or blocked once the purpose for storing it no longer applies, provided no statutory retention obligations prevent erasure and no different information is given below for specific processing operations.'
'a) Sitzungs-Cookies/Session-Cookies': 'a) Session cookies'
'Wir verwenden mit unserem Internetauftritt sog. Cookies. Cookies sind kleine Textdateien oder andere Speichertechnologien, die durch den von Ihnen eingesetzten Internet-Browser auf Ihrem Endgerät ablegt und gespeichert werden. Durch diese Cookies werden im individuellen Umfang bestimmte Informationen von Ihnen, wie beispielsweise Ihre Browser- oder Standortdaten oder Ihre IP-Adresse, verarbeitet.': 'This website uses cookies. Cookies are small text files or other storage technologies placed and stored on your device by the internet browser you use. These cookies process certain information about you, such as your browser or location data or your IP address, to varying degrees.'
'Durch diese Verarbeitung wird unser Internetauftritt benutzerfreundlicher, effektiver und sicherer, da die Verarbeitung bspw. die Wiedergabe unseres Internetauftritts in unterschiedlichen Sprachen oder das Angebot einer Warenkorbfunktion ermöglicht.': 'This processing makes our website more user-friendly, effective, and secure, for example by enabling the site to be displayed in different languages or providing a shopping cart function.'
'Rechtsgrundlage dieser Verarbeitung ist Art. 6 Abs. 1 lit b.) DSGVO, sofern diese Cookies Daten zur Vertragsanbahnung oder Vertragsabwicklung verarbeitet werden.': 'The legal basis for this processing is Article 6(1)(b) GDPR where these cookies process data for the initiation or performance of a contract.'
'Falls die Verarbeitung nicht der Vertragsanbahnung oder Vertragsabwicklung dient, liegt unser berechtigtes Interesse in der Verbesserung der Funktionalität unseres Internetauftritts. Rechtsgrundlage ist in dann Art. 6 Abs. 1 lit. f) DSGVO.': 'If processing does not serve the initiation or performance of a contract, our legitimate interest is to improve the functionality of our website. The legal basis is then Article 6(1)(f) GDPR.'
'Mit Schließen Ihres Internet-Browsers werden diese Session-Cookies gelöscht.': 'These session cookies are deleted when you close your internet browser.'
'b) Drittanbieter-Cookies': 'b) Third-party cookies'
'Wir verwenden keine Cookies von Drittanbietern.': 'We do not use third-party cookies.'
'c) Beseitigungsmöglichkeit': 'c) How to disable cookies'
'Sie können die Installation der Cookies durch eine Einstellung Ihres Internet-Browsers verhindern oder einschränken. Ebenfalls können Sie bereits gespeicherte Cookies jederzeit löschen. Die hierfür erforderlichen Schritte und Maßnahmen hängen jedoch von Ihrem konkret genutzten Internet-Browser ab. Bei Fragen benutzen Sie daher bitte die Hilfefunktion oder Dokumentation Ihres Internet-Browsers oder wenden sich an dessen Hersteller bzw. Support. Bei sog. Flash-Cookies kann die Verarbeitung allerdings nicht über die Einstellungen des Browsers unterbunden werden. Stattdessen müssen Sie insoweit die Einstellung Ihres Flash-Players ändern. Auch die hierfür erforderlichen Schritte und Maßnahmen hängen von Ihrem konkret genutzten Flash-Player ab. Bei Fragen benutzen Sie daher bitte ebenso die Hilfefunktion oder Dokumentation Ihres Flash-Players oder wenden sich an den Hersteller bzw. Benutzer-Support.': 'You can prevent or restrict cookies through your internet browser settings. You can also delete cookies already stored at any time. The steps required depend on the browser you use. If you have questions, please consult your browser’s help or documentation, or contact its manufacturer or support team. Processing via Flash cookies cannot be prevented through browser settings; instead, you must change your Flash Player settings. The steps depend on the Flash Player you use. If you have questions, consult its help or documentation, or contact the manufacturer or user support.'
'Sollten Sie die Installation der Cookies verhindern oder einschränken, kann dies allerdings dazu führen, dass nicht sämtliche Funktionen unseres Internetauftritts vollumfänglich nutzbar sind.': 'Preventing or restricting cookies may mean that not all features of this website are fully available.'
