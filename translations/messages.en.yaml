'Mitglieder von Clownsteams können Zuordnungen vornehmen': 'Clown team members can make assignments'
'Die Zuordnung von Clowns zu Spielterminen kann von Mitgliedern des Teams dieses Spielortes vorgenommen werden. Sie bekommen auch einen Hinweis im Dashboard, wenn es offene Zuordnungen für diesen Spielort gibt.': 'Members of a venue’s team can assign clowns to performances. They also see a dashboard notification when that venue has open assignments.'
'Feature "Rechnungsverwaltung für Clownshonorare"': '“Clown invoice management” feature'
'Mit der Rechnungsverwaltung können Clowns-Honorare erfasst und durch eine monatliche Rechnungsansicht werden die Clowns in ihrer Rechnungsstellung bzw. das Büro bei der Kontrolle dieser unterstützt.': 'Invoice management lets you record clown fees. A monthly invoice view helps clowns issue their invoices and helps the office check them.'
'Feature "Rechnungsstellung Clowns"': '“Clown invoicing” feature'
'Clowns (oder das Büro) können ihre Rechnung als “gestellt” markieren. Clowns können selber einstellen, ob sie im Dashboard und/oder per Email über zu stellende Rechnungen benachrichtigt werden. Rechnungen, die bis zum 1. des übernächsten Monats nicht als gestellt markiert wurden, erscheinen im Büro-Dashboard in einer Liste nicht gestellter Rechnungen.': 'Clowns (or the office) can mark their invoices as issued. Clowns can choose whether to be notified about invoices to issue in the dashboard and/or by email. Invoices not marked as issued by the first day of the month after next appear in a list of unissued invoices on the office dashboard.'
'Feature "Rechnungsbezahlung Clowns"': '“Paying clown invoices” feature'
'Das Büro kann gestellte Clowns-Rechnungen als "bezahlt" markieren. Im Büro-Dashboard wird eine Liste zu bezahlender Rechnungen angezeigt.': 'The office can mark issued clown invoices as paid. A list of invoices to pay is shown on the office dashboard.'
