'Deine Anfrage wird per Email an die gewählten Clowns gesendet.': 'Your request will be emailed to the selected clowns.'
'Achtung! Wenn Du zwei Clowns suchst, musst Du zwei separate Anfragen stellen. Diese Anfrage wird geschlossen, sobald sich ein Clown gefunden hat.': 'Warning! If you need two clowns, you must submit two separate requests. This request will be closed as soon as a clown is found.'
'Alle Spieltermine eines Bündels werden bei der Berechnung aber auch bei manueller Zuordnung mit den gleichen Clowns besetzt.': 'All play dates in a bundle are assigned the same clowns, both during calculation and when assigning them manually.'
'Hier können mehrere Spieltermine gebündelt werden.': 'Multiple play dates can be bundled here.'
'Dieser Spieltermin ist Teil eines Bündels mit Terminen. Zuordnungen wirken sich auf alle Termine im Bündel aus.': 'This play date is part of a bundle. Assignments affect all dates in the bundle.'
'Der Spieltermin wird als abgesagt markiert. Falls zu dem Zeitslot kein anderer Spieltermin existiert, wird der Springertermin entfernt.': 'The play date will be marked as cancelled. If no other play date exists in this time slot, the substitute date will be removed.'
'Der Spieltermin wird dann endgültig gelöscht und kann nicht wiederhergestellt werden.': 'The play date will then be permanently deleted and cannot be restored.'
'ACHTUNG! Der Spieltermin liegt in der Vergangenheit bzw. die Spielplanerstellung ist schon abgeschlossen!': 'WARNING! This play date is in the past or the schedule has already been completed!'
'Eventuell wäre es sinnvoller, die "Absagen"-Funktion in der Detailansicht zu nutzen, um Änderungen für die Clowns transparent zu machen.': 'It may be better to use the "Cancel" function in the details view so the clowns can see the changes.'
'Der Spieltermin wird auf ein neues Datum und/oder eine neue Uhrzeit verschoben. Ein neuer Spieltermin wird angelegt, der alte Spieltermin wird als verschoben markiert. Falls zu dem Zeitslot kein anderer Spieltermin existiert, wird der alte Springertermin entfernt. Zu dem neuen Spieltermin muss ein Springer manuell zugeordnet werden.': 'The play date will be moved to a new date and/or time. A new play date will be created and the old one marked as rescheduled. If no other play date exists in the time slot, the old substitute date will be removed. A substitute must be assigned manually to the new play date.'
'Super, Du bist für diesen Termin angemeldet! Du bist für diesen Termin leider (noch) nicht angemeldet.': 'Great, you are signed up for this date! Unfortunately, you are not signed up for this date (yet).'
